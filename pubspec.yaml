name: madbeauty
description: "MadBeauty — réservation beauté / coiffure afro (clients & prestataires)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.0.0
  supabase_flutter: ^2.12.4
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  geolocator: ^13.0.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/cf.jpg
    - assets/images/ch.jpg
    - assets/images/cf1.jpg
    - assets/images/ch1.jpg
    - assets/images/m.jpg
    - assets/images/mmm.webp
    - assets/images/pe.jpg
    - assets/images/pi.jpg
    - assets/images/ta.jpg
    - assets/images/pe.avif
    - assets/images/salon_bg.jpg