# Déploie le site vitrine (dossier website/) sur Netlify.
# URL cible : https://madbeauty-web.netlify.app
#
# Secret GitHub requis (Settings → Secrets and variables → Actions) :
#   NETLIFY_AUTH_TOKEN — https://app.netlify.com/user/applications#personal-access-tokens

name: Deploy website Netlify

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - features/v2
      - deploy
      - feature/boutique-packs
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website-netlify.yml'

concurrency:
  group: deploy-website-netlify
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: madbeauty-web
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier les secrets
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Secret manquant : NETLIFY_AUTH_TOKEN"
            exit 1
          fi

      - name: Déployer sur Netlify
        working-directory: website
        run: npx --yes netlify-cli@26.1.0 deploy --prod --no-build
