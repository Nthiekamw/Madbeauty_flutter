# Back-office admin MadBeauty — site statique dans web/
# Variables Netlify requises : SUPABASE_URL, SUPABASE_ANON_KEY

[build]
  command = "node scripts/generate_web_admin_config.js"
  publish = "web"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
